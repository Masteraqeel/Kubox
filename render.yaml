# Render blueprint: in Render choose New > Blueprint and pick this repository.
# It creates the web service (from the Dockerfile) and a Postgres database, and asks for the admin values.
services:
  - type: web
    name: kubox
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kubox-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: INVITE_CODE
        sync: false
databases:
  - name: kubox-db
    plan: free
